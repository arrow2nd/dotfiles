name: Update Nix flake inputs

on:
  workflow_dispatch:
  schedule:
    # 月曜 09:17 JST。定時付近の混雑を避ける。
    - cron: "17 0 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          path-to-flake-dir: nix
          branch: automation/update-flake-lock
          pr-title: "🆙 (nix): nix/flake.lock"
          pr-body: |
            全ホストで共有する `nix/flake.lock` の週次更新です。

            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```
